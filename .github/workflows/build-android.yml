name: Build Zara Android
on:
  push:
    branches: ["main", "feat/zara-online-android-apk-20261027", "feat/zara-offline-text", "fix/zara-offline-compatibility"]
    paths: ["android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zara-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: 620d2225cc436ab0b001e3200e590e3b286ef9ab
          path: android/llama.cpp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Check native bridge
        run: node android/tests/native-bridge.test.mjs
      - name: Build local CPU inference smoke test
        run: |
          cmake -S android/app/src/main/cpp -B /tmp/zara-smoke -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/zara-smoke --target zara_offline_smoke -j2
      - name: Verify model and test real local inference
        run: |
          curl --fail --location --retry 2 --max-time 300 "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf?download=true" -o /tmp/zara-qwen.gguf
          echo "74a4da8c9fdbcd15bd1f6d01d621410d31c6fc00986f5eb687824e7b93d7a9db  /tmp/zara-qwen.gguf" | sha256sum --check
          /tmp/zara-smoke/zara_offline_smoke /tmp/zara-qwen.gguf
      - name: Build and check Android app
        run: gradle -p android :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon
      - name: Build and test real 32-bit ARM inference
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-arm-linux-gnueabihf qemu-user
          cmake -S android/app/src/main/cpp -B /tmp/zara-smoke-arm32 -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=Linux -DCMAKE_SYSTEM_PROCESSOR=armv7l -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++ -DCMAKE_C_FLAGS="-mfpu=neon-vfpv4" -DCMAKE_CXX_FLAGS="-mfpu=neon-vfpv4"
          cmake --build /tmp/zara-smoke-arm32 --target zara_offline_smoke -j2
          readelf -h /tmp/zara-smoke-arm32/zara_offline_smoke | grep ELF32
          qemu-arm -cpu cortex-a15 -L /usr/arm-linux-gnueabihf /tmp/zara-smoke-arm32/zara_offline_smoke /tmp/zara-qwen.gguf
      - name: Prepare unsigned package and signing verifier
        run: |
          mkdir -p android-artifact
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk android-artifact/Zara-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android-artifact/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android-artifact/Zara-unsigned.apk > android-artifact/apk-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: zara-android-unsigned
          path: android-artifact/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zara-android-checks
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
