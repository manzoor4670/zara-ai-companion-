<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zara Admin & Training</title><style>body{font:16px system-ui;background:#10121d;color:#f5edf3;margin:0}main{max-width:760px;margin:auto;padding:20px}a{color:#ffbad9}header,.panel{background:#202333;border:1px solid #404052;border-radius:18px;padding:16px;margin:12px 0}button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid #686174;padding:10px;background:#303346;color:white}button{cursor:pointer;background:#9c426f}textarea{width:95%;min-height:100px}input{max-width:100%}.messages{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{padding:12px;border-radius:15px;max-width:85%;white-space:pre-wrap}.user{background:#39425d;align-self:flex-end}.assistant{background:#59364e;align-self:flex-start}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}small{color:#c5b9c8}h1{font-size:1.6rem}</style></head><body><main><header><h1>⚙️ Zara Admin & Training</h1><a href="./index.html">← Return to Zara Chat</a><p><small>Settings saved in this browser only. This page has no login protection. Do not enter secrets or private data.</small></p></header><section class="panel"><label>AI Name<br><input id="name"></label><p><label>Language <select id="language"><option>Roman Urdu</option><option>Urdu</option><option>English</option></select></label></p><p><label>Welcome Message<textarea id="welcome"></textarea></label></p><p><label>Personality & Instructions<textarea id="instructions" style="min-height:160px"></textarea></label></p><p><label>Training Examples / Knowledge<textarea id="examples" placeholder="Q: ...&#10;A: ..." style="min-height:160px"></textarea></label></p><p><label>Secure AI Backend Endpoint (optional)<input id="endpoint" type="url" style="width:95%" placeholder="https://your-worker.example.workers.dev"></label></p><p><button id="testConnection" type="button">🔌 Check AI Connection</button></p><p id="connectionStatus" role="status" aria-live="polite">AI Connection: Not checked</p><div class="toolbar"><button id="save">Save Training</button><button id="export">Export JSON</button><button id="reset">Reset settings</button></div><p id="status" aria-live="polite"></p></section></main><script>
const defaults={name:"Zara",language:"Roman Urdu",welcome:"Assalam o alaikum! Main Zara hoon. Aaj kaisa din guzra?",instructions:"You are Zara, a kind and playful adult AI companion. Normal = friendly. Romantic = gentle affection. Adult 18+ = flirty but not sexually explicit. Speak in the user's preferred language.",examples:"",endpoint:""};const fields=Object.keys(defaults);const saved={...defaults,...JSON.parse(localStorage.getItem("zara_settings")||"{}")};fields.forEach(k=>document.getElementById(k).value=saved[k]||"");
document.getElementById("save").onclick=()=>{let out={};fields.forEach(k=>out[k]=document.getElementById(k).value.trim());if(out.endpoint&&!/^https:\/\//.test(out.endpoint)){document.getElementById("status").textContent="Endpoint must start with https://";return;}localStorage.setItem("zara_settings",JSON.stringify(out));document.getElementById("status").textContent="Saved on this browser. Open Chat to see changes.";};
document.getElementById("export").onclick=()=>{let o={};fields.forEach(k=>o[k]=document.getElementById(k).value);let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));a.download="zara-settings.json";a.click();URL.revokeObjectURL(a.href);};
document.getElementById("reset").onclick=()=>{if(confirm("Reset all training settings?")){localStorage.removeItem("zara_settings");location.reload();}};

document.getElementById("testConnection").onclick=async()=>{
 const status=document.getElementById("connectionStatus"),button=document.getElementById("testConnection");
 const endpoint=document.getElementById("endpoint").value.trim();
 if(!/^https:\/\//i.test(endpoint)){status.textContent="AI Connection: HTTPS Worker URL pehle enter karein.";return;}
 button.disabled=true;status.textContent="AI Connection: Checking...";
 try{
  const response=await fetch(endpoint,{method:"GET",cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  const data=await response.json();
  if(data.service!=="Zara AI Chat"){status.textContent="Wrong endpoint: Zara AI Chat Worker ka URL dijiye, Dress Try-On ka nahi.";}
  else if(data.ready===true){status.textContent="✅ Zara AI Chat Worker online hai aur Gemini secret configured hai. Save Training dabayein, phir Chat test karein.";}
  else{status.textContent="⚠️ Zara AI Chat Worker online hai, lekin Gemini API Secret abhi set nahi hui.";}
 }catch(error){status.textContent="❌ Worker tak connection nahi ho raha: "+error.message;}
 finally{button.disabled=false;}
};
</script></body></html>
