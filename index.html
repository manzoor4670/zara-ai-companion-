<!doctype html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Zara AI Chat</title><style>body{font:16px system-ui;background:#10121d;color:#f5edf3;margin:0}main{max-width:760px;margin:auto;padding:20px}a{color:#ffbad9}header,.panel{background:#202333;border:1px solid #404052;border-radius:18px;padding:16px;margin:12px 0}button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid #686174;padding:10px;background:#303346;color:white}button{cursor:pointer;background:#9c426f}textarea{width:95%;min-height:100px}input{max-width:100%}.messages{height:48vh;overflow:auto;display:flex;flex-direction:column;gap:10px}.bubble{padding:12px;border-radius:15px;max-width:85%;white-space:pre-wrap}.user{background:#39425d;align-self:flex-end}.assistant{background:#59364e;align-self:flex-start}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}small{color:#c5b9c8}h1{font-size:1.6rem}</style></head><body><main><header><h1>💕 Zara AI Chat</h1><p>Urdu • Roman Urdu • English</p><a href="./admin.html">⚙️ Admin & Training</a><p><a href="./avatar.html">👗 Zara Avatar & Dress Gallery</a></p></header><section class="panel"><div class="toolbar"><label>Mode <select id="mode"><option value="normal">Normal</option><option value="romantic">Romantic Medium</option><option value="adult">18+ Flirty (non-explicit)</option></select></label><button id="exportChat">⬇️ Export Chat</button><label style="display:inline-block;cursor:pointer">⬆️ Import Chat <input id="importChat" type="file" accept=".json,application/json" style="max-width:160px"></label><button id="clear">Clear chat</button><button id="speak">🔈 Voice on/off</button></div><div id="messages" class="messages" aria-live="polite"></div><div class="toolbar"><input id="message" placeholder="Apna message likhein..." aria-label="Message" style="flex:1"><button id="mic">🎤</button><button id="send">Send</button></div><label>📷 Image preview <input id="image" type="file" accept="image/*"></label><div id="preview"></div><p><small id="status">Demo replies until an AI endpoint is connected. Image is previewed, not understood in demo mode.</small></p><p><button id="checkConnection" type="button">🔌 Check AI Status</button></p><p><small id="aiHealth" role="status" aria-live="polite">AI status not checked.</small></p></section></main><script>
const defaults={name:"Zara",language:"Roman Urdu",welcome:"Assalam o alaikum! Main Zara hoon. Aaj kaisa din guzra?",instructions:"You are Zara, a kind, witty adult AI companion. Reply in the user's language. Normal is friendly, romantic is affectionate, adult is playful/flirty but never sexually explicit. Do not pretend to be human.",examples:"",endpoint:""};
const cfg={...defaults,...JSON.parse(localStorage.getItem("zara_settings")||"{}")};
const el=id=>document.getElementById(id), messages=el("messages");let history=JSON.parse(localStorage.getItem("zara_history")||"[]"), voice=false, imageData="";
function add(role,content){let d=document.createElement("div");d.className="bubble "+role;d.textContent=content;messages.append(d);messages.scrollTop=messages.scrollHeight;}
function render(){messages.replaceChildren();if(!history.length)add("assistant",cfg.welcome);history.forEach(m=>add(m.role==="user"?"user":"assistant",m.content));}render();
function save(){localStorage.setItem("zara_history",JSON.stringify(history.slice(-60)));}
function say(s){if(!voice||!("speechSynthesis" in window))return;let u=new SpeechSynthesisUtterance(s);u.lang=/[\u0600-\u06ff]/.test(s)?"ur-PK":"en-US";speechSynthesis.speak(u);}
function demo(s){let greeting=/salam|hello|hi|assalam|سلام/i.test(s);if(greeting)return cfg.welcome;return el("mode").value==="normal"?"Main sun rahi hoon. Apne din ke bare mein aur bataiye.":el("mode").value==="romantic"?"Aap se baat karke achha lagta hai 💗 Aur sunao, kya chal raha hai?":"Aaj aap ka andaz bara playful hai 😉 Batao, kya baat karni hai?";}
async function send(){let s=el("message").value.trim();if(!s&&!imageData)return;el("send").disabled=true;history.push({role:"user",content:s||"[Image]"});add("user",s||"[Image]");el("message").value="";let reply="";try{if(!cfg.endpoint){reply=demo(s);el("status").textContent="Demo mode: connect a secure AI endpoint for real answers.";}else{let r=await fetch(cfg.endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:s,mode:el("mode").value,language:cfg.language,instructions:cfg.instructions,examples:cfg.examples,history:history.slice(-12),image:imageData})});if(!r.ok)throw Error("Endpoint HTTP "+r.status);let j=await r.json();if(typeof j.reply!=="string")throw Error("Endpoint must return JSON reply");reply=j.reply;el("status").textContent="AI response received.";}}catch(e){reply="Connection error. Please check the endpoint in Admin & Training.";el("status").textContent=String(e.message);}history.push({role:"assistant",content:reply});add("assistant",reply);save();say(reply);el("send").disabled=false;imageData="";el("image").value="";el("preview").replaceChildren();}
el("checkConnection").onclick=async()=>{const status=el("aiHealth"),button=el("checkConnection");if(!cfg.endpoint){status.textContent="Demo mode only. Open Admin & Training and add a secure AI endpoint to enable real answers.";return;}button.disabled=true;status.textContent="Checking AI connection...";try{const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),12000);let response;try{response=await fetch(cfg.endpoint,{method:"GET",cache:"no-store",signal:controller.signal});}finally{clearTimeout(timer);}if(!response.ok)throw Error("HTTP "+response.status);const data=await response.json();if(data.ready===true)status.textContent="✅ AI server reports ready. Send a message to verify chat replies.";else if(data.ready===false)status.textContent="⚠️ Server online but not ready: "+String(data.notice||"AI service unavailable");else status.textContent="Server responds, but AI readiness cannot be confirmed. Try a chat message."; }catch(error){status.textContent="Connection check failed: "+error.message+". Check the endpoint in Admin & Training.";}finally{button.disabled=false;}};
el("exportChat").onclick=()=>{const safe=history.filter(x=>x&&["user","assistant"].includes(x.role)&&typeof x.content==="string").slice(-60);const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),messages:safe},null,2)],{type:"application/json"});const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="zara-chat-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);el("status").textContent="Chat backup download started. Keep the file private.";};
el("importChat").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;if(f.size>250000){el("status").textContent="Backup too large (max 250 KB).";return;}try{const obj=JSON.parse(await f.text());if(obj.version!==1||!Array.isArray(obj.messages)||obj.messages.length>60||!obj.messages.every(x=>x&&["user","assistant"].includes(x.role)&&typeof x.content==="string"&&x.content.length<=10000))throw Error("Invalid Zara backup format");if(!confirm("Replace current chat with the imported backup? Export current chat first if needed."))return;history=obj.messages.map(x=>({role:x.role,content:x.content}));save();render();el("status").textContent="Chat backup restored on this browser."; }catch(err){el("status").textContent="Import failed: "+err.message;}};
el("send").onclick=send;el("message").onkeydown=e=>{if(e.key==="Enter")send()};el("clear").onclick=()=>{history=[];save();render()};el("speak").onclick=()=>{voice=!voice;el("speak").textContent=voice?"🔊 Voice on":"🔈 Voice off"};el("image").onchange=()=>{const f=el("image").files[0];if(!f)return;if(f.size>1500000){el("status").textContent="Please choose an image smaller than 1.5 MB.";return;}const reader=new FileReader();reader.onload=()=>{imageData=reader.result;let img=document.createElement("img");img.src=imageData;img.alt="Selected image";img.style.maxWidth="180px";el("preview").replaceChildren(img);};reader.readAsDataURL(f);};
el("mic").onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){el("status").textContent="Speech recognition not supported in this browser.";return;}let rec=new SR();rec.lang=cfg.language==="Urdu"?"ur-PK":"en-US";rec.onresult=e=>el("message").value=e.results[0][0].transcript;rec.onerror=()=>el("status").textContent="Microphone recognition failed.";rec.start()};
</script></body></html>
